name: Signed Firefox release

on:
  workflow_dispatch:
  push:
    tags: ['firefox-v*']

permissions:
  contents: read

concurrency:
  group: signed-firefox-release
  cancel-in-progress: false

jobs:
  release:
    # Signing runs on release tags or a manual default-branch run, never PR code.
    if: startsWith(github.ref, 'refs/tags/firefox-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Check signing credentials
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY" || { echo 'Missing repository secret AMO_JWT_ISSUER'; exit 1; }
          test -n "$WEB_EXT_API_SECRET" || { echo 'Missing repository secret AMO_JWT_SECRET'; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps firefox
      - run: npm run test:browser -- --project=firefox
      - name: Check release version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="firefox-v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo 'Release tag must match the version in package.json.'
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the version before signing another release."
            exit 1
          fi
      - name: Sign for self-distribution (no marketplace listing)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign:firefox -- --no-input --no-config-discovery --timeout 900000
      - name: Prepare signed release assets
        run: node scripts/prepare-firefox-release.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-firefox-extension
          path: dist/firefox-release/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          gh release create "firefox-v$VERSION" dist/firefox-release/* \
            --target "$GITHUB_SHA" \
            --title "Firefox extension v$VERSION" \
            --notes-file docs/FIREFOX_RELEASE_NOTES.md
